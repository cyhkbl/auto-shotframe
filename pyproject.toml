[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "auto-shotframe"
version = "0.1.0"
description = "Create EXIF photo frames from JPEG, HEIF, and TIFF photos."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "auto-shotframe contributors" },
]
keywords = ["exif", "frame", "heic", "heif", "jpeg", "photography", "tiff", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "Pillow>=10.4",
  "piexif>=1.1.3",
  "pillow-heif>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/SeanYancy/auto-shotframe"
Repository = "https://github.com/SeanYancy/auto-shotframe"
Issues = "https://github.com/SeanYancy/auto-shotframe/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "resvg-py>=0.3.3",
  "ruff>=0.12",
  "twine>=6.1",
]

[project.scripts]
auto-shotframe = "auto_shotframe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_shotframe"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "auto_shotframe/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/docs",
  "/scripts",
  "/src",
  "/tests",
  "/README.md",
  "/README.zh-CN.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
